<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MídiaControl</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2334;--border:#2a3044;--accent:#e8b84b;--accent2:#3d7fff;--danger:#e05050;--success:#3ecf8e;--warning:#f5a623;--text:#e8eaf0;--text2:#8b92a8;--text3:#555e78;--r:10px;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,#1a2240 0%,var(--bg) 60%)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:390px;box-shadow:var(--shadow)}
.login-logo{font-family:'DM Serif Display',serif;font-size:28px;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.login-tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:24px}
.login-tab{flex:1;text-align:center;padding:8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:transparent;transition:all .2s}
.login-tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.form-group{margin-bottom:13px}
label{font-size:11px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
input:disabled{opacity:.5}
select option{background:var(--surface)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--r);border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#1a1200}.btn-primary:hover{background:#f0c85a}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#0a2e1e}.btn-success:hover{opacity:.88}
.btn-blue{background:var(--accent2);color:#fff}.btn-blue:hover{opacity:.88}
.btn-warn{background:var(--warning);color:#1a0e00}
.btn-full{width:100%;justify-content:center}.btn-sm{padding:6px 12px;font-size:12px}
.alert{padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:13px}
.alert-error{background:rgba(224,80,80,.12);border:1px solid var(--danger);color:#f08080}
.alert-success{background:rgba(62,207,142,.12);border:1px solid var(--success);color:var(--success)}
#app{display:none}.layout{display:flex;min-height:100vh}
.sidebar{width:224px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo .brand{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent)}
.sidebar-logo .tagline{font-size:11px;color:var(--text3);margin-top:2px}
.nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13.5px;color:var(--text2);border:none;background:transparent;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--accent);background:rgba(232,184,75,.08);border-right:3px solid var(--accent)}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border)}
.user-chip{font-size:12px;color:var(--text2);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{margin-left:224px;flex:1;padding:28px 32px;min-height:100vh}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px}
.page-sub{font-size:13px;color:var(--text2);margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px}
.stat-value{font-family:'DM Serif Display',serif;font-size:30px}
.stat-accent{color:var(--accent)}.stat-blue{color:var(--accent2)}.stat-green{color:var(--success)}.stat-red{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600}
.search-input{padding:8px 12px;font-size:13px;width:220px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:1px solid var(--border);font-weight:500}
td{padding:11px 16px;font-size:13.5px;border-bottom:1px solid rgba(42,48,68,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.013)}
.actions-cell{display:flex;gap:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge-ativo{background:rgba(62,207,142,.15);color:var(--success)}
.badge-cancelado{background:rgba(224,80,80,.15);color:var(--danger)}
.badge-finalizado,.badge-pago{background:rgba(139,146,168,.15);color:var(--text2)}
.badge-pendente{background:rgba(245,166,35,.15);color:var(--warning)}
.badge-disponivel{background:rgba(62,207,142,.15);color:var(--success)}
.badge-ocupado{background:rgba(224,80,80,.15);color:var(--danger)}
.badge-outdoor{background:rgba(61,127,255,.15);color:var(--accent2)}
.badge-tv{background:rgba(232,184,75,.15);color:var(--accent)}
.badge-entrada{background:rgba(62,207,142,.15);color:var(--success)}
.badge-saida{background:rgba(224,80,80,.15);color:var(--danger)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:660px;max-width:97vw;max-height:93vh;overflow-y:auto;box-shadow:var(--shadow);transform:translateY(20px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1}
.modal-body{padding:22px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:18px 0 11px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cep-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.cep-status{font-size:11px;margin-top:4px;min-height:15px}
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:38px;margin-bottom:12px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:13px;height:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.mono{font-family:monospace}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px}
.tag-pix{background:rgba(61,127,255,.15);color:var(--accent2)}
.tag-cnpj{background:rgba(232,184,75,.15);color:var(--accent)}
#map{height:280px;border-radius:8px;border:1px solid var(--border);margin-top:8px}
.fin-tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:18px}
.fin-tab{flex:1;text-align:center;padding:9px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:transparent;transition:all .2s}
.fin-tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.resumo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.resumo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.resumo-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:5px}
.resumo-value{font-family:'DM Serif Display',serif;font-size:22px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">MídiaControl</div>
    <div class="login-sub">Gestão de locação de pontos de mídia</div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('login')">Entrar</button>
      <button class="login-tab" onclick="switchTab('register')">Criar conta</button>
    </div>
    <div id="auth-alert"></div>
    <div class="form-group"><label>E-mail</label><input type="email" id="auth-email" placeholder="seu@email.com"/></div>
    <div class="form-group"><label>Senha</label><input type="password" id="auth-password" onkeydown="if(event.key==='Enter')doAuth()"/></div>
    <button class="btn btn-primary btn-full" onclick="doAuth()"><span id="auth-btn-text">Entrar</span></button>
  </div>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo"><div class="brand">MídiaControl</div><div class="tagline">Gestão de Locação</div></div>
      <nav class="nav">
        <button class="nav-item" onclick="navigate('dashboard')"><span style="width:20px;text-align:center">◈</span> Dashboard</button>
        <button class="nav-item" onclick="navigate('clientes')"><span style="width:20px;text-align:center">👤</span> Clientes</button>
        <button class="nav-item" onclick="navigate('pontos')"><span style="width:20px;text-align:center">📍</span> Pontos de Mídia</button>
        <button class="nav-item" onclick="navigate('contratos')"><span style="width:20px;text-align:center">📋</span> Contratos</button>
        <button class="nav-item" onclick="navigate('proprietarios')"><span style="width:20px;text-align:center">🏢</span> Proprietários</button>
        <button class="nav-item" onclick="navigate('financeiro')"><span style="width:20px;text-align:center">💰</span> Financeiro</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip" id="sidebar-user"></div>
        <button class="btn btn-secondary btn-full btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>
    <main class="main" id="main-content"></main>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="modal-title"></span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────
let TOKEN = '';
let USER_EMAIL = '';
let _map = null, _mapMarker = null;

// ── PING: mantém o servidor informado que o navegador está aberto ──
// O backend encerra o processo se não receber ping por 30s
setInterval(async () => {
  if (TOKEN) {
    try { await fetch('/api/ping'); } catch(e) {}
  }
}, 10000); // a cada 10 segundos

// Envia beacon ao fechar (best-effort para watchdog)
// NAO limpa sessionStorage aqui - isso causaria logout ao trocar de aba
window.addEventListener('pagehide', () => {
  try { navigator.sendBeacon('/api/ping'); } catch(e) {}
});

// Inicializa sessao
(function() {
  const params = new URLSearchParams(window.location.search);
  const isBoot = params.get('boot') === '1';
  const alreadyBooted = sessionStorage.getItem('mc_booted') === '1';

  if (isBoot && !alreadyBooted) {
    // Primeira abertura do .exe: limpa credenciais antigas
    sessionStorage.clear();
    sessionStorage.setItem('mc_booted', '1');
  } else {
    // Recarregamento normal dentro da mesma sessao: restaura credenciais
    TOKEN = sessionStorage.getItem('mc_token') || '';
    USER_EMAIL = sessionStorage.getItem('mc_email') || '';
  }
  // Remove ?boot=1 da URL sem recarregar
  if (isBoot) window.history.replaceState({}, '', '/');
})();

// ── API ──────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if (TOKEN) opts.headers['Authorization'] = 'Bearer '+TOKEN;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api'+path, opts);
  const data = await r.json().catch(()=>({}));
  // Token invalido, expirado ou usuario inativo: logout automatico silencioso
  if (r.status === 401) {
    TOKEN = ''; USER_EMAIL = '';
    sessionStorage.removeItem('mc_token');
    sessionStorage.removeItem('mc_email');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('auth-alert').innerHTML =
      '<div class="alert alert-error">Sessão expirada. Faça login novamente.</div>';
    setTimeout(()=>{ const el=document.getElementById('auth-alert'); if(el) el.innerHTML=''; }, 5000);
    throw new Error('session_expired');
  }
  if (!r.ok) throw new Error(data.error||r.statusText);
  return data;
}

// ── CNPJ lookup ──────────────────────────────────────────────
async function buscarCNPJ(prefix) {
  const el = document.getElementById(prefix+'documento');
  const st = document.getElementById(prefix+'cnpj-status');
  const cnpj = (el?.value||'').replace(/\D/g,'');
  if (cnpj.length !== 14) { st.textContent='CNPJ inválido — informe os 14 dígitos'; st.style.color='var(--danger)'; return; }
  st.innerHTML='<span class="spinner spinner-sm"></span> Buscando...'; st.style.color='var(--text3)';
  try {
    // Usa função api() que já inclui o header Authorization automaticamente
    const d = await api('GET', '/util/cnpj/'+cnpj);
    // Campos de dados principais (IDs com sufixo -tel e -email)
    const setVal = (id, val) => { const e=document.getElementById(id); if(e&&val) e.value=val; };
    setVal(prefix+'nome',      d.razao_social||d.nome_fantasia||'');
    // Tenta os dois padrões de ID para telefone e email
    const telId  = document.getElementById(prefix+'tel')   ? prefix+'tel'   : prefix+'telefone';
    const mailId = document.getElementById(prefix+'email') ? prefix+'email' : prefix+'email';
    setVal(telId,  d.telefone||'');
    setVal(mailId, d.email||'');
    setVal(prefix+'cep',        d.cep ? d.cep.replace(/\D/g,'').replace(/(\d{5})(\d{3})/,'$1-$2') : '');
    setVal(prefix+'logradouro', d.logradouro||'');
    setVal(prefix+'numero',     d.numero||'');
    setVal(prefix+'complemento',d.complemento||'');
    setVal(prefix+'bairro',     d.bairro||'');
    setVal(prefix+'cidade',     d.municipio||d.cidade||'');
    setVal(prefix+'estado',     d.uf||'');
    const tpEl = document.getElementById(prefix+'tipo_pessoa');
    if (tpEl) tpEl.value = 'PJ';
    st.textContent = '✓ '+(d.razao_social||d.nome_fantasia||'Dados preenchidos');
    st.style.color = 'var(--success)';
  } catch(e) { st.textContent = '✗ '+e.message; st.style.color='var(--danger)'; }
}

// ── CEP lookup ───────────────────────────────────────────────
async function buscarCEP(prefix, fillCoords) {
  const el = document.getElementById(prefix+'cep');
  const st = document.getElementById(prefix+'cep-status');
  const cep = el.value.replace(/\D/g,'');
  if (cep.length !== 8) { st.textContent='CEP inválido'; st.style.color='var(--danger)'; return; }
  st.innerHTML='<span class="spinner spinner-sm"></span> Buscando...'; st.style.color='var(--text3)';
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (d.erro) throw new Error('CEP não encontrado');
    document.getElementById(prefix+'logradouro').value = d.logradouro||'';
    document.getElementById(prefix+'bairro').value = d.bairro||'';
    document.getElementById(prefix+'cidade').value = d.localidade||'';
    document.getElementById(prefix+'estado').value = d.uf||'';
    st.textContent='✓ Endereço preenchido'; st.style.color='var(--success)';
    document.getElementById(prefix+'numero')?.focus();
    if (fillCoords) setTimeout(()=>geocodificarEndereco(prefix), 600);
  } catch(e) { st.textContent=e.message; st.style.color='var(--danger)'; }
}

function maskCEP(el){ let v=el.value.replace(/\D/g,''); if(v.length>5) v=v.slice(0,5)+'-'+v.slice(5,8); el.value=v; }
function maskDoc(el){ 
  let v=el.value.replace(/\D/g,'');
  if(v.length<=11) v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  else v=v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
  el.value=v;
}

// ── Geocodificação Nominatim (OSM) ────────────────────────────
async function geocodificarEndereco(prefix) {
  const log = document.getElementById(prefix+'logradouro')?.value||'';
  const num = document.getElementById(prefix+'numero')?.value||'';
  const cid = document.getElementById(prefix+'cidade')?.value||'';
  const est = document.getElementById(prefix+'estado')?.value||'';
  if (!log || !cid) return;
  // Proxy backend: evita bloqueio TLS/CORS no executavel Windows
  const q = `${log} ${num}, ${cid}, ${est}, Brasil`;
  try {
    const data = await api('GET', `/util/geocode?q=${encodeURIComponent(q)}`);
    if (Array.isArray(data) && data.length) {
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);
      const latEl = document.getElementById(prefix+'lat');
      const lngEl = document.getElementById(prefix+'lng');
      if (latEl) latEl.value = lat.toFixed(6).replace(',','.');
      if (lngEl) lngEl.value = lng.toFixed(6).replace(',','.');
      atualizarMapa(lat, lng);
    }
  } catch(e) { console.warn('Geocodificação falhou:', e.message); }
}

// ── Mapa Leaflet ──────────────────────────────────────────────
function initMap(lat, lng) {
  if (_map) { _map.remove(); _map=null; _mapMarker=null; }
  setTimeout(()=>{
    const el = document.getElementById('map');
    if (!el) return;
    const center = (lat && lng) ? [lat, lng] : [-15.7801, -47.9292];
    _map = L.map('map').setView(center, lat?15:5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {attribution:'© OpenStreetMap', maxZoom:19}).addTo(_map);
    if (lat && lng) {
      _mapMarker = L.marker([lat,lng]).addTo(_map);
    }
    _map.on('click', function(e){
      const {lat, lng} = e.latlng;
      atualizarMapa(lat, lng);
      const latEl = document.getElementById('p-lat');
      const lngEl = document.getElementById('p-lng');
      // Força notacao com ponto decimal independente do locale do OS
      if (latEl) latEl.value = lat.toFixed(6).replace(',','.');
      if (lngEl) lngEl.value = lng.toFixed(6).replace(',','.');
    });
  }, 100);
}

function atualizarMapa(lat, lng) {
  if (!_map) return;
  if (_mapMarker) _map.removeLayer(_mapMarker);
  _mapMarker = L.marker([lat,lng]).addTo(_map);
  _map.setView([lat,lng], 15);
}

// ── Helpers ───────────────────────────────────────────────────
const fmt = c => 'R$ '+(c/100).toFixed(2).replace('.',',');
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const bStatus = s => {const m={ATIVO:'ativo',CANCELADO:'cancelado',FINALIZADO:'finalizado',DISPONIVEL:'disponivel',OCUPADO:'ocupado',PAGO:'pago',PENDENTE:'pendente'};return`<span class="badge badge-${m[s]||''}">${s}</span>`};
const bTipo = t => `<span class="badge badge-${t==='TV'?'tv':'outdoor'}">${t}</span>`;
const spin = () => '<div style="text-align:center;padding:40px"><div class="spinner"></div></div>';
const empty = (icon,text) => `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${text}</div></div>`;
const v = id => {const e=document.getElementById(id);return e?e.value.trim():'';};

function getAddr(p){return{cep:v(p+'cep'),logradouro:v(p+'logradouro'),numero:v(p+'numero'),complemento:v(p+'complemento'),bairro:v(p+'bairro'),cidade:v(p+'cidade'),estado:v(p+'estado')}}

// ── AUTH ──────────────────────────────────────────────────────
let authMode='login';
function switchTab(m){authMode=m;document.querySelectorAll('.login-tab').forEach((t,i)=>t.classList.toggle('active',(m==='login'&&i===0)||(m==='register'&&i===1)));document.getElementById('auth-btn-text').textContent=m==='login'?'Entrar':'Criar conta'}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pwd=document.getElementById('auth-password').value;
  const alertEl=document.getElementById('auth-alert');
  if(!email||!pwd){showAlert(alertEl,'Preencha e-mail e senha.','error');return}
  try{
    if(authMode==='register'){await api('POST','/auth/register',{email,password:pwd});showAlert(alertEl,'Conta criada! Faça login.','success');switchTab('login');return}
    const data=await api('POST','/auth/login',{email,password:pwd});
    TOKEN=data.token; USER_EMAIL=email;
    sessionStorage.setItem('mc_token',TOKEN); sessionStorage.setItem('mc_email',email);
    startApp();
  }catch(e){showAlert(alertEl,e.message,'error')}
}
function showAlert(el,msg,type){el.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;setTimeout(()=>el.innerHTML='',5000)}
function logout(){
  TOKEN=''; USER_EMAIL='';
  sessionStorage.clear(); // limpa tudo incluindo mc_booted
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function startApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('sidebar-user').textContent=USER_EMAIL;navigate('dashboard')}
if(TOKEN) startApp();

      <div class="form-group"><label>Longitude</label><input id="p-lng" type="text" inputmode="decimal" placeholder="-48.123456" value="${lng||''}" onchange="atualizarMapaManual()"/></div>

function atualizarMapaManual(){
  const lat=parseCoord(document.getElementById('p-lat')?.value);
  const lng=parseCoord(document.getElementById('p-lng')?.value);
  if(!isNaN(lat)&&!isNaN(lng)) atualizarMapa(lat,lng);
}

function parseCoord(val){
  // Aceita tanto ponto quanto virgula como separador decimal (pt-BR)
  if(!val && val!==0) return NaN;
  return parseFloat(String(val).replace(',','.'));
}
async function savePonto(id){
  const nome = v('p-nome');
  if(!nome){alert('Nome é obrigatório');return}

  let lat = parseCoord(document.getElementById('p-lat').value);
  let lng = parseCoord(document.getElementById('p-lng').value);

  // Se lat/lng ainda estão vazios, tenta geocodificar agora (sincrono)
  if(isNaN(lat)||isNaN(lng)){
    const log=v('p-logradouro'), num=v('p-numero'), cid=v('p-cidade'), est=v('p-estado');
    if(log && cid){
      const btn = document.querySelector('[onclick*="savePonto"]');
      if(btn){btn.textContent='Buscando coordenadas...';btn.disabled=true;}
      try{
        const q=`${log} ${num}, ${cid}, ${est}, Brasil`;
        const data=await api('GET',`/util/geocode?q=${encodeURIComponent(q)}`);
        if(Array.isArray(data)&&data.length){
          lat=parseFloat(data[0].lat);
          lng=parseFloat(data[0].lon);
          document.getElementById('p-lat').value=lat.toFixed(6);
          document.getElementById('p-lng').value=lng.toFixed(6);
          atualizarMapa(lat,lng);
        }
      }catch(e){console.warn('Geocode no save falhou:',e.message);}
      if(btn){btn.textContent=id?'Salvar':'Criar Ponto';btn.disabled=false;}
    }
  }

  // Se ainda nao tem coordenadas, permite salvar sem — coordenadas sao opcionais
  const body={
    nome, tipo:v('p-tipo'), status:v('p-status'),
    latitude:isNaN(lat)?null:lat,
    longitude:isNaN(lng)?null:lng,
    cep:v('p-cep'),logradouro:v('p-logradouro'),numero:v('p-numero'),
    complemento:v('p-complemento'),bairro:v('p-bairro'),
    cidade:v('p-cidade'),estado:v('p-estado')
  };

  try{
    if(id) await api('PUT',`/pontos/${id}`,body);
    else await api('POST','/pontos/',body);
    closeModal();
    renderPontos();
  }catch(e){alert(e.message)}
}
async function deletePonto(id){if(!confirm('Excluir este ponto?'))return;await api('DELETE',`/pontos/${id}`).catch(e=>alert(e.message));renderPontos()}

function autoPreencherProprietario(sel, propSelId, pontoMap){
  const pid = parseInt(sel.value);
  const ponto = pontoMap[pid];
  if(ponto?.proprietario_id){
    document.getElementById(propSelId).value = ponto.proprietario_id;
  }
}

function calcRepasse(){
  const val=parseFloat((document.getElementById('ct-val')?.value||'0').replace(',','.'));
  const pct=parseFloat((document.getElementById('ct-rep-pct')?.value||'0').replace(',','.'));
  const el=document.getElementById('ct-rep-val');
  if(el&&!isNaN(val)&&!isNaN(pct)) el.value=(val*pct/100).toFixed(2);
}
function calcRepasseInv(){
  const val=parseFloat((document.getElementById('ct-val')?.value||'0').replace(',','.'));
  const rep=parseFloat((document.getElementById('ct-rep-val')?.value||'0').replace(',','.'));
  const el=document.getElementById('ct-rep-pct');
  if(el&&val>0&&!isNaN(rep)) el.value=(rep/val*100).toFixed(1);
}
function toggleRepasse(){
  const tipo=document.getElementById('ct-repasse-tipo')?.value;
  const el=document.getElementById('repasse-fields');
  if(el) el.style.display=(tipo==='PERMUTA'||tipo==='ISENTO')?'none':'block';
}

function previewParcelas(){
  const val   = parseFloat((document.getElementById('ct-val')?.value||'0').replace(',','.'));
  const n     = parseInt(document.getElementById('ct-nparcelas')?.value||1);
  const ini   = document.getElementById('ct-ini')?.value;
  const dVec  = parseInt(document.getElementById('ct-dia-vec')?.value||25);
  const dPag  = parseInt(document.getElementById('ct-dia-pag')?.value||30);
  const tipo  = document.getElementById('ct-repasse-tipo')?.value||'DINHEIRO';
  const rep   = parseFloat((document.getElementById('ct-rep-val')?.value||'0').replace(',','.'));
  const el    = document.getElementById('ct-preview');
  if(!ini||!val){el.style.display='block';el.innerHTML='⚠ Informe valor e data de início para ver o preview';return}
  let html = `<strong>Preview de ${n} parcela(s):</strong><br><br>`;
  html += `<div style="display:grid;grid-template-columns:${tipo==='DINHEIRO'&&rep>0?'1fr 1fr':'1fr'};gap:8px">`;
  html += `<div><strong style="color:var(--success)">Recebimentos (dia ${dVec})</strong><br>`;
  for(let i=1;i<=Math.min(n,6);i++){
    const dt = calcDtParcela(ini,i,dVec);
    html += `<div style="margin-top:4px">Parcela ${i}/${n} — ${dt} — <span style="color:var(--success)">R$ ${val.toFixed(2).replace('.',',')}</span></div>`;
  }
  if(n>6) html+=`<div style="color:var(--text3)">... +${n-6} parcelas</div>`;
  html+='</div>';
  if(tipo==='DINHEIRO'&&rep>0){
    html+=`<div><strong style="color:var(--danger)">Repasses (dia ${dPag})</strong><br>`;
    for(let i=1;i<=Math.min(n,6);i++){
      const dt=calcDtParcela(ini,i,dPag);
      html+=`<div style="margin-top:4px">Parcela ${i}/${n} — ${dt} — <span style="color:var(--danger)">R$ ${rep.toFixed(2).replace('.',',')}</span></div>`;
    }
    if(n>6) html+=`<div style="color:var(--text3)">... +${n-6} parcelas</div>`;
    html+='</div>';
  }
  html+='</div>';
  html+=`<br><strong>Total receber: <span style="color:var(--success)">R$ ${(val*n).toFixed(2).replace('.',',')}</span></strong>`;
  if(tipo==='DINHEIRO'&&rep>0) html+=` | <strong>Total repassar: <span style="color:var(--danger)">R$ ${(rep*n).toFixed(2).replace('.',',')}</span></strong>`;
  el.style.display='block'; el.innerHTML=html;
}

function calcDtParcela(dataInicio,numero,dia){
  const base=new Date(dataInicio+'T12:00:00');
  let mes=base.getMonth()+numero;
  let ano=base.getFullYear()+Math.floor((mes-1)/12);
  mes=((mes-1)%12)+1;
  const ultimo=new Date(ano,mes,0).getDate();
  const diaReal=Math.min(dia,ultimo);
  return `${String(diaReal).padStart(2,'0')}/${String(mes).padStart(2,'0')}/${ano}`;
}

async function saveContrato(id){
  const tipo=v('ct-repasse-tipo');
  const body={
    cliente_id:     parseInt(document.getElementById('ct-cli').value),
    ponto_id:       parseInt(document.getElementById('ct-pto').value),
    proprietario_id:parseInt(document.getElementById('ct-prop').value)||null,
    valor_cents:    Math.round(parseFloat((document.getElementById('ct-val').value||'0').replace(',','.'))*100),
    num_parcelas:   parseInt(document.getElementById('ct-nparcelas').value||1),
    repasse_percent:tipo==='DINHEIRO'?parseFloat((document.getElementById('ct-rep-pct')?.value||'0').replace(',','.')):0,
    repasse_cents:  tipo==='DINHEIRO'?Math.round(parseFloat((document.getElementById('ct-rep-val')?.value||'0').replace(',','.'))*100):0,
    tipo_repasse:   tipo,
    dia_vencimento: parseInt(document.getElementById('ct-dia-vec')?.value||25),
    dia_pagamento:  parseInt(document.getElementById('ct-dia-pag')?.value||30),
    data_inicio:    v('ct-ini'),
    data_termino:   v('ct-fim')||null,
    observacoes:    v('ct-obs'),
  };
  if(id) body.status=v('ct-status');
  if(!body.cliente_id||!body.ponto_id){alert('Cliente e ponto obrigatórios');return}
  if(!body.data_inicio){alert('Data de início obrigatória');return}
  if(body.num_parcelas<1||body.num_parcelas>120){alert('Número de parcelas deve ser entre 1 e 120');return}
  try{
    const result=id?await api('PUT',`/contracts/${id}`,body):await api('POST','/contracts/',body);
    closeModal();
    renderContratos();
    // Mostra resumo das parcelas geradas
    if(result.parcelas){
      const rec=result.parcelas.filter(p=>p.tipo==='RECEBIMENTO').length;
      const rep=result.parcelas.filter(p=>p.tipo==='REPASSE').length;
      setTimeout(()=>alert(`✓ Contrato salvo!\n${rec} parcelas de recebimento geradas.${rep?'\n'+rep+' parcelas de repasse geradas.':''}`),300);
    }
  }catch(e){alert(e.message)}
}

async function openParcelasModal(contratoId){
  const contrato=await api('GET',`/contracts/${contratoId}`).catch(()=>null);
  if(!contrato){alert('Erro ao carregar contrato');return}
  const receb=contrato.parcelas?.filter(p=>p.tipo==='RECEBIMENTO')||[];
  const repas=contrato.parcelas?.filter(p=>p.tipo==='REPASSE')||[];
  const hoje=new Date().toISOString().slice(0,10);

  const tabelaParcelas=(lista,titulo,cor)=>{
    if(!lista.length) return '';
    return `<div class="section-title" style="color:${cor}">${titulo}</div>
    <table style="margin-bottom:16px"><thead><tr>
      <th>#</th><th>Competência</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Pago em</th><th></th>
    </tr></thead><tbody>
      ${lista.map(p=>`<tr>
        <td>${p.numero}</td>
        <td>${p.competencia}</td>
        <td style="${p.data_vencimento<hoje&&p.status==='PENDENTE'?'color:var(--danger);font-weight:600':''}">${fmtDate(p.data_vencimento)}</td>
        <td class="mono">${fmt(p.valor_cents)}</td>
        <td>${bStatus(p.status)}</td>
        <td style="font-size:12px;color:var(--text2)">${p.data_pagamento?fmtDate(p.data_pagamento):'—'}</td>
        <td><div class="actions-cell">
          ${p.status==='PENDENTE'?`<button class="btn btn-success btn-sm" onclick="pagarParcela(${p.id},${contratoId})">Pagar</button>`:''}
          <button class="btn btn-secondary btn-sm" onclick="editarParcela(${p.id},${contratoId})">✎</button>
        </div></td>
      </tr>`).join('')}
    </tbody></table>`;
  };

  const totalRec=receb.reduce((a,p)=>a+p.valor_cents,0);
  const pagoRec=receb.filter(p=>p.status==='PAGO').reduce((a,p)=>a+p.valor_cents,0);
  const totalRep=repas.reduce((a,p)=>a+p.valor_cents,0);
  const pagoRep=repas.filter(p=>p.status==='PAGO').reduce((a,p)=>a+p.valor_cents,0);

  openModal(`Parcelas — Contrato #${contratoId}`,`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="resumo-card"><div class="resumo-label">Total Receber</div><div class="resumo-value stat-green" style="font-size:18px">${fmt(totalRec)}</div><div style="font-size:11px;color:var(--text3)">Pago: ${fmt(pagoRec)}</div></div>
      <div class="resumo-card"><div class="resumo-label">Total Repassar</div><div class="resumo-value stat-red" style="font-size:18px">${fmt(totalRep)}</div><div style="font-size:11px;color:var(--text3)">Pago: ${fmt(pagoRep)}</div></div>
      <div class="resumo-card"><div class="resumo-label">Saldo Líquido</div><div class="resumo-value ${totalRec-totalRep>=0?'stat-green':'stat-red'}" style="font-size:18px">${fmt(totalRec-totalRep)}</div></div>
    </div>
    ${tabelaParcelas(receb,'📥 Recebimentos do Cliente','var(--success)')}
    ${tabelaParcelas(repas,'📤 Repasses ao Proprietário','var(--danger)')}
  `,`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>`);
}

async function pagarParcela(parcelaId,contratoId){
  const hoje=new Date().toISOString().slice(0,10);
  const dt=prompt('Data do pagamento (AAAA-MM-DD):',hoje);
  if(!dt) return;
  await api('POST',`/contracts/parcelas/${parcelaId}/pagar`,{data_pagamento:dt}).catch(e=>alert(e.message));
  openParcelasModal(contratoId);
}

async function editarParcela(parcelaId,contratoId){
  const hoje=new Date().toISOString().slice(0,10);
  const novoVenc=prompt('Nova data de vencimento (AAAA-MM-DD) — deixe em branco para manter:');
  const novoValor=prompt('Novo valor em R$ — deixe em branco para manter:');
  const body={};
  if(novoVenc) body.data_vencimento=novoVenc;
  if(novoValor) body.valor_cents=Math.round(parseFloat(novoValor)*100);
  if(Object.keys(body).length){
    await api('PUT',`/contracts/parcelas/${parcelaId}`,body).catch(e=>alert(e.message));
    openParcelasModal(contratoId);
  }
}

  await api('POST',`/contracts/${id}/cancel`).catch(e=>alert(e.message));
  renderContratos();
}

async function saveProp(id){
  const body={nome:v('pr-nome'),documento:v('pr-documento'),tipo_pessoa:v('pr-tipo_pessoa'),telefone:v('pr-tel'),email:v('pr-email'),...getAddr('pr-'),...getBanco('pr-')};
  if(!body.nome){alert('Nome obrigatório');return}
  try{if(id)await api('PUT',`/proprietarios/${id}`,body);else await api('POST','/proprietarios/',body);closeModal();renderProprietarios()}catch(e){alert(e.message)}
}
async function deleteProp(id){if(!confirm('Excluir?'))return;await api('DELETE',`/proprietarios/${id}`).catch(e=>alert(e.message));renderProprietarios()}

// ── FINANCEIRO ────────────────────────────────────────────────
let finTab = 'parcelas';

async function renderFinanceiro() {
  const mes = new Date().toISOString().slice(0,7);
  document.getElementById('main-content').innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Financeiro</div>
      <div class="page-sub">Recebimentos, repasses, taxas e gastos operacionais</div></div>
      <button class="btn btn-primary" onclick="openLancamentoModal()">+ Gasto / Receita Avulsa</button>
    </div>
    <div class="fin-tabs">
      <button class="fin-tab active"  onclick="switchFinTab('parcelas',this)">📋 Parcelas de Contratos</button>
      <button class="fin-tab"         onclick="switchFinTab('gastos',this)">💸 Gastos e Receitas Avulsas</button>
      <button class="fin-tab"         onclick="switchFinTab('resumo',this)">📊 Resumo Mensal</button>
    </div>
    <div id="fin-content">${spin()}</div>`;
  loadFinTab(finTab);
}

function switchFinTab(tab, btn) {
  finTab = tab;
  document.querySelectorAll('.fin-tab').forEach(t => t.classList.toggle('active', t === btn));
  loadFinTab(tab);
}

async function loadFinTab(tab) {
  const el  = document.getElementById('fin-content');
  const mes = new Date().toISOString().slice(0,7);
  if (tab === 'resumo') {
    el.innerHTML = `<div class="form-group" style="max-width:200px"><label>Mês</label>
      <input type="month" id="fin-mes" value="${mes}" onchange="loadResumo()"/></div>
      <div id="resumo-content">${spin()}</div>`;
    loadResumo();
  } else if (tab === 'gastos') {
    el.innerHTML = `<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <select id="g-tipo" onchange="loadGastos()" style="width:160px">
        <option value="">Todos</option>
        <option value="ENTRADA">Entradas Avulsas</option>
        <option value="SAIDA">Saídas / Gastos</option>
      </select>
      <input type="month" id="g-mes" value="${mes}" onchange="loadGastos()" style="width:160px"/>
    </div>
    <div class="card"><div id="gastos-table">${spin()}</div></div>`;
    loadGastos();
  } else {
    el.innerHTML = `<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <select id="p-tipo-f" onchange="loadParcelasFin()" style="width:180px">
        <option value="">Todos</option>
        <option value="RECEBIMENTO">📥 A Receber</option>
        <option value="REPASSE">📤 A Repassar</option>
      </select>
      <select id="p-status-f" onchange="loadParcelasFin()" style="width:160px">
        <option value="">Todos status</option>
        <option value="PENDENTE">Pendente</option>
        <option value="PAGO">Pago</option>
        <option value="CANCELADO">Cancelado</option>
      </select>
      <input type="month" id="p-mes-f" value="${mes}" onchange="loadParcelasFin()" style="width:160px"/>
    </div>
    <div class="card"><div id="parcelas-fin-table">${spin()}</div></div>`;
    loadParcelasFin();
  }
}

// ── Parcelas de contratos ─────────────────────────────────────
async function loadParcelasFin() {
  const tipo   = document.getElementById('p-tipo-f')?.value   || '';
  const status = document.getElementById('p-status-f')?.value || '';
  const mes    = document.getElementById('p-mes-f')?.value    || '';
  const el     = document.getElementById('parcelas-fin-table');
  el.innerHTML = spin();
  let q = ''; const p = [];
  if (tipo)   p.push('tipo='+tipo);
  if (status) p.push('status='+status);
  if (mes)    p.push('mes='+mes);
  if (p.length) q = '?' + p.join('&');
  const rows = await api('GET', '/financeiro/parcelas'+q).catch(() => []);
  if (!rows.length) { el.innerHTML = empty('📋','Nenhuma parcela encontrada'); return; }
  const hoje = new Date().toISOString().slice(0,10);
  el.innerHTML = `<table><thead><tr>
    <th>#</th><th>Tipo</th><th>Contrato</th><th>Parte</th><th>Competência</th>
    <th>Vencimento</th><th>Valor</th><th>Taxa</th><th>Status</th><th>Pago em</th><th></th>
  </tr></thead><tbody>
    ${rows.map(l => `<tr>
      <td class="mono" style="color:var(--text3)">${l.id}</td>
      <td><span class="badge badge-${l.tipo==='RECEBIMENTO'?'entrada':'saida'}">${l.tipo==='RECEBIMENTO'?'📥 RECEBER':'📤 REPASSAR'}</span></td>
      <td class="mono" style="font-size:12px">#${l.contrato_id}${l.ponto_nome?' — '+l.ponto_nome:''}</td>
      <td style="font-size:12px">${l.tipo==='RECEBIMENTO'?(l.cliente_nome||'—'):(l.proprietario_nome||'—')}</td>
      <td style="font-size:12px;color:var(--text2)">${l.competencia||''}</td>
      <td style="${l.data_vencimento<hoje&&l.status==='PENDENTE'?'color:var(--danger);font-weight:600':''}">${fmtDate(l.data_vencimento)}</td>
      <td class="mono" style="${l.tipo==='RECEBIMENTO'?'color:var(--success)':'color:var(--danger)'}">${fmt(l.valor_cents)}</td>
      <td class="mono" style="color:var(--warning);font-size:12px">${l.taxa_cents?fmt(l.taxa_cents):'—'}</td>
      <td>${bStatus(l.status)}</td>
      <td style="font-size:12px;color:var(--text2)">${l.data_pagamento?fmtDate(l.data_pagamento):'—'}</td>
      <td><div class="actions-cell">
        ${l.status==='PENDENTE'||l.status==='ATRASADO'
          ? `<button class="btn btn-success btn-sm" onclick="openPagarParcelaModal(${l.id})">Pagar</button>`
          : `<button class="btn btn-secondary btn-sm" onclick="openPagarParcelaModal(${l.id})">Editar</button>`}
      </div></td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function openPagarParcelaModal(pid) {
  const hoje = new Date().toISOString().slice(0,10);
  // Busca dados da parcela
  const rows = await api('GET', `/financeiro/parcelas?`).catch(() => []);
  openModal('Registrar Pagamento', `
    <div class="form-group"><label>Data do pagamento *</label>
      <input id="pp-data" type="date" value="${hoje}"/>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Pode ser uma data retroativa</div>
    </div>
    <div class="form-group"><label>Taxa bancária (R$) — opcional</label>
      <input id="pp-taxa" type="number" step="0.01" placeholder="0,00" value="0"/>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Taxa de boleto, cartão, etc. Será somada ao custo total.</div>
    </div>
    <div class="form-group"><label>Observações</label>
      <input id="pp-obs" placeholder="Ex: Pago via PIX, boleto vencido, etc."/>
    </div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarPagamentoParcela(${pid})">Confirmar Pagamento</button>`);
}

async function confirmarPagamentoParcela(pid) {
  const data = v('pp-data');
  if (!data) { alert('Data obrigatória'); return; }
  const taxa = Math.round(parseFloat((document.getElementById('pp-taxa').value||'0').replace(',','.'))*100);
  const body = { data_pagamento: data, taxa_cents: taxa||null, observacoes: v('pp-obs')||null };
  try {
    await api('POST', `/financeiro/parcelas/${pid}/pagar`, body);
    closeModal();
    loadParcelasFin();
    loadResumo();
  } catch(e) { alert(e.message); }
}

// ── Gastos e receitas avulsas ─────────────────────────────────
async function loadGastos() {
  const tipo = document.getElementById('g-tipo')?.value || '';
  const mes  = document.getElementById('g-mes')?.value  || '';
  const el   = document.getElementById('gastos-table');
  el.innerHTML = spin();
  let q = ''; const p = [];
  if (tipo) p.push('tipo='+tipo);
  if (mes)  p.push('mes='+mes);
  if (p.length) q = '?' + p.join('&');
  const rows = await api('GET', '/financeiro/lancamentos'+q).catch(() => []);
  if (!rows.length) { el.innerHTML = empty('💸','Nenhum lançamento'); return; }
  el.innerHTML = `<table><thead><tr>
    <th>#</th><th>Tipo</th><th>Categoria</th><th>Descrição</th>
    <th>Valor</th><th>Taxa</th><th>Data</th><th>Status</th><th></th>
  </tr></thead><tbody>
    ${rows.map(l => `<tr>
      <td class="mono" style="color:var(--text3)">${l.id}</td>
      <td><span class="badge badge-${l.tipo==='ENTRADA'?'entrada':'saida'}">${l.tipo==='ENTRADA'?'📥 ENTRADA':'📤 SAÍDA'}</span></td>
      <td><span class="tag tag-cnpj" style="font-size:11px">${l.categoria||'—'}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        ${l.descricao||'—'}
        ${l.cliente_nome?`<br><span style="font-size:11px;color:var(--text3)">${l.cliente_nome}</span>`:''}
      </td>
      <td class="mono" style="${l.tipo==='ENTRADA'?'color:var(--success)':'color:var(--danger)'}">${fmt(l.valor_cents)}</td>
      <td class="mono" style="color:var(--warning);font-size:12px">${l.taxa_cents?fmt(l.taxa_cents):'—'}</td>
      <td>${fmtDate(l.data_lancamento)}</td>
      <td>${bStatus(l.status)}</td>
      <td><div class="actions-cell">
        <button class="btn btn-danger btn-sm" onclick="deleteGasto(${l.id})">✕</button>
      </div></td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function deleteGasto(id) {
  if (!confirm('Excluir este lançamento?')) return;
  await api('DELETE', `/financeiro/lancamentos/${id}`).catch(e => alert(e.message));
  loadGastos();
}

// ── Resumo consolidado ────────────────────────────────────────
async function loadResumo() {
  const mes = document.getElementById('fin-mes')?.value || '';
  const el  = document.getElementById('resumo-content');
  if (!el) return;
  el.innerHTML = spin();
  try {
    const r = await api('GET', `/financeiro/resumo${mes?'?mes='+mes:''}`);
    const saldoCor = r.saldo_realizado >= 0 ? 'stat-green' : 'stat-red';
    const prevCor  = r.saldo_previsto  >= 0 ? 'stat-green' : 'stat-red';
    el.innerHTML = `
      <div class="resumo-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px">
        <div class="resumo-card">
          <div class="resumo-label">📥 Recebimentos de Contratos</div>
          <div class="resumo-value stat-green" style="font-size:20px">${fmt(r.recebimentos_total)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">
            Pagos: ${fmt(r.recebimentos_pagos)} | Pendentes: ${fmt(r.recebimentos_pendentes)}
          </div>
        </div>
        <div class="resumo-card">
          <div class="resumo-label">📤 Repasses a Proprietários</div>
          <div class="resumo-value stat-red" style="font-size:20px">${fmt(r.repasses_total)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">
            Pagos: ${fmt(r.repasses_pagos)} | Pendentes: ${fmt(r.repasses_pendentes)}
          </div>
        </div>
        <div class="resumo-card">
          <div class="resumo-label">💸 Gastos Operacionais</div>
          <div class="resumo-value stat-red" style="font-size:20px">${fmt(r.saidas_total)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">Pagos: ${fmt(r.saidas_pagas)}</div>
        </div>
        <div class="resumo-card">
          <div class="resumo-label">📈 Entradas Avulsas</div>
          <div class="resumo-value stat-green" style="font-size:20px">${fmt(r.entradas_total)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">Pagas: ${fmt(r.entradas_pagas)}</div>
        </div>
      </div>
      <div class="resumo-grid" style="grid-template-columns:repeat(2,1fr)">
        <div class="resumo-card" style="border-color:${r.saldo_realizado>=0?'var(--success)':'var(--danger)'}">
          <div class="resumo-label">✅ Saldo Realizado</div>
          <div class="resumo-value ${saldoCor}">${fmt(r.saldo_realizado)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px">Apenas valores já pagos</div>
        </div>
        <div class="resumo-card" style="border-color:${r.saldo_previsto>=0?'var(--success)':'var(--danger)'}">
          <div class="resumo-label">🔮 Saldo Previsto</div>
          <div class="resumo-value ${prevCor}">${fmt(r.saldo_previsto)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px">Inclui pendentes</div>
        </div>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--danger)">${e.message.replace(/</g,'&lt;')}</div>`;
  }
}

// ── Modal lançamento avulso ───────────────────────────────────
function openLancamentoModal() {
  const hoje = new Date().toISOString().slice(0,10);
  openModal('Novo Gasto / Receita Avulsa', `
    <div class="section-title">💸 Dados do Lançamento</div>
    <div class="form-row">
      <div class="form-group"><label>Tipo *</label>
        <select id="l-tipo">
          <option value="SAIDA">📤 Saída / Gasto</option>
          <option value="ENTRADA">📥 Entrada / Receita</option>
        </select>
      </div>
      <div class="form-group"><label>Categoria *</label>
        <select id="l-cat">
          <option value="INSTALACAO">🔧 Instalação</option>
          <option value="MANUTENCAO">🛠 Manutenção</option>
          <option value="TAXA_BANCARIA">🏦 Taxa Bancária</option>
          <option value="ALUGUEL">🏠 Aluguel de Ponto</option>
          <option value="ENERGIA">⚡ Energia Elétrica</option>
          <option value="IMPRESSAO">🖨 Impressão / Material</option>
          <option value="TRANSPORTE">🚗 Transporte</option>
          <option value="COMISSAO">💼 Comissão</option>
          <option value="IMPOSTO">📄 Imposto / Taxas</option>
          <option value="OUTRO">📦 Outro</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Descrição</label>
      <input id="l-desc" placeholder="Ex: Instalação outdoor Rua Principal, manutenção TV #3..."/>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Valor (R$) *</label>
        <input id="l-val" type="number" step="0.01" placeholder="0,00"/>
      </div>
      <div class="form-group"><label>Taxa bancária (R$)</label>
        <input id="l-taxa" type="number" step="0.01" placeholder="0,00" value="0"/>
        <div style="font-size:11px;color:var(--text3);margin-top:3px">Boleto, cartão, etc.</div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Data *</label>
        <input id="l-data" type="date" value="${hoje}"/>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="l-status">
          <option value="PAGO">Pago</option>
          <option value="PENDENTE">Pendente</option>
        </select>
      </div>
    </div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveLancamento()">Salvar</button>`);
}

async function saveLancamento() {
  const val  = Math.round(parseFloat((document.getElementById('l-val').value||'0').replace(',','.'))*100);
  const taxa = Math.round(parseFloat((document.getElementById('l-taxa').value||'0').replace(',','.'))*100);
  if (!val) { alert('Valor obrigatório'); return; }
  const body = {
    tipo:            v('l-tipo'),
    categoria:       v('l-cat'),
    descricao:       v('l-desc'),
    valor_cents:     val,
    taxa_cents:      taxa || 0,
    data_lancamento: v('l-data'),
    status:          v('l-status'),
  };
  try {
    await api('POST', '/financeiro/lancamentos', body);
    closeModal();
    loadGastos();
  } catch(e) { alert(e.message); }
}

</script>
